<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Loop Engineering ecosystem map</title>
  <desc id="desc">A layered map showing Prompt Engineering, Context Engineering, Harness Engineering, and Loop Engineering around agent loops.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1200" height="720" rx="34" fill="url(#bg)"/>
  <text x="600" y="64" text-anchor="middle" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="34" font-weight="800">Loop Engineering Stack</text>
  <text x="600" y="98" text-anchor="middle" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17">From single prompts to recurring, stateful, verified agent systems</text>

  <g filter="url(#shadow)">
    <rect x="80" y="140" width="1040" height="86" rx="22" fill="#1e293b" stroke="#334155"/>
    <text x="130" y="176" fill="#93c5fd" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="700">Prompt Engineering</text>
    <text x="130" y="204" fill="#e2e8f0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16">What should the model do now?</text>

    <rect x="80" y="246" width="1040" height="86" rx="22" fill="#172554" stroke="#1d4ed8"/>
    <text x="130" y="282" fill="#bfdbfe" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="700">Context Engineering</text>
    <text x="130" y="310" fill="#dbeafe" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16">What state, memory, docs, and examples should the agent see?</text>

    <rect x="80" y="352" width="1040" height="86" rx="22" fill="#312e81" stroke="#6366f1"/>
    <text x="130" y="388" fill="#ddd6fe" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="700">Harness Engineering</text>
    <text x="130" y="416" fill="#ede9fe" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16">What tools, permissions, sandboxes, traces, and checks surround one agent run?</text>

    <rect x="80" y="458" width="1040" height="176" rx="26" fill="url(#loop)" opacity="0.95"/>
    <text x="130" y="493" fill="#082f49" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="900">Loop Engineering</text>
    <text x="130" y="522" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="600">A recurring system that prompts, verifies, persists state, retries, reports, and escalates agent work.</text>
  </g>

  <g fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.82">
    <path d="M242 570 H292"/>
    <path d="M292 570 l-12 -8 v16 Z" fill="#0f172a" stroke="none"/>
    <path d="M380 570 H430"/>
    <path d="M430 570 l-12 -8 v16 Z" fill="#0f172a" stroke="none"/>
    <path d="M542 570 H592"/>
    <path d="M592 570 l-12 -8 v16 Z" fill="#0f172a" stroke="none"/>
    <path d="M668 570 H718"/>
    <path d="M718 570 l-12 -8 v16 Z" fill="#0f172a" stroke="none"/>
    <path d="M810 570 H860"/>
    <path d="M860 570 l-12 -8 v16 Z" fill="#0f172a" stroke="none"/>
    <path d="M992 570 H1050 V622 H190 C150 622 130 604 130 592"/>
    <path d="M130 592 l-8 12 h16 Z" fill="#0f172a" stroke="none"/>
    <path d="M764 592 V608"/>
    <path d="M764 608 l-8 -12 h16 Z" fill="#0f172a" stroke="none"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="13" font-weight="800">
    <rect x="130" y="548" width="112" height="44" rx="22" fill="#0f172a" opacity="0.9"/>
    <text x="186" y="575" text-anchor="middle" fill="#e0f2fe">Trigger</text>
    <rect x="292" y="548" width="88" height="44" rx="22" fill="#0f172a" opacity="0.9"/>
    <text x="336" y="575" text-anchor="middle" fill="#e0f2fe">Intake</text>
    <rect x="430" y="548" width="112" height="44" rx="22" fill="#0f172a" opacity="0.9"/>
    <text x="486" y="575" text-anchor="middle" fill="#e0f2fe">Delegate</text>
    <rect x="592" y="548" width="76" height="44" rx="22" fill="#0f172a" opacity="0.9"/>
    <text x="630" y="575" text-anchor="middle" fill="#e0f2fe">Act</text>
    <rect x="718" y="548" width="92" height="44" rx="22" fill="#0f172a" opacity="0.9"/>
    <text x="764" y="575" text-anchor="middle" fill="#e0f2fe">Verify</text>
    <rect x="860" y="548" width="132" height="44" rx="22" fill="#0f172a" opacity="0.9"/>
    <text x="926" y="575" text-anchor="middle" fill="#e0f2fe">Persist state</text>
    <text x="764" y="628" text-anchor="middle" fill="#7f1d1d" font-size="14" font-weight="900">if failed: retry or escalate</text>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15">
    <circle cx="95" cy="695" r="5" fill="#38bdf8"/>
    <text x="112" y="700" fill="#cbd5e1">Core contract: objective, trigger, intake, workspace, context, delegation, verification, state, budget, escalation, exit.</text>
  </g>
</svg>
