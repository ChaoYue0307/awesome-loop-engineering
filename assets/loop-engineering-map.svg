<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Loop Engineering ecosystem map</title>
  <desc id="desc">A layered map showing Prompt Engineering, Context Engineering, Harness Engineering, and Loop Engineering as a clean loop contract pipeline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0f172a"/>
    </marker>
  </defs>

  <rect width="1200" height="700" rx="34" fill="url(#bg)"/>
  <text x="600" y="64" text-anchor="middle" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="34" font-weight="800">Loop Engineering Stack</text>
  <text x="600" y="98" text-anchor="middle" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="17">From single prompts to recurring, stateful, verified agent systems</text>

  <g filter="url(#shadow)">
    <rect x="80" y="140" width="1040" height="86" rx="22" fill="#1e293b" stroke="#334155"/>
    <text x="130" y="176" fill="#93c5fd" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="700">Prompt Engineering</text>
    <text x="130" y="204" fill="#e2e8f0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16">What should the model do now?</text>

    <rect x="80" y="246" width="1040" height="86" rx="22" fill="#172554" stroke="#1d4ed8"/>
    <text x="130" y="282" fill="#bfdbfe" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="700">Context Engineering</text>
    <text x="130" y="310" fill="#dbeafe" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16">What state, memory, docs, and examples should the agent see?</text>

    <rect x="80" y="352" width="1040" height="86" rx="22" fill="#312e81" stroke="#6366f1"/>
    <text x="130" y="388" fill="#ddd6fe" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="20" font-weight="700">Harness Engineering</text>
    <text x="130" y="416" fill="#ede9fe" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16">What tools, permissions, sandboxes, traces, and checks surround one agent run?</text>

    <rect x="80" y="458" width="1040" height="160" rx="26" fill="url(#loop)" opacity="0.95"/>
    <text x="130" y="493" fill="#082f49" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="22" font-weight="900">Loop Engineering</text>
    <text x="130" y="522" fill="#0f172a" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="16" font-weight="600">A loop contract for recurring, stateful, verified agent work.</text>
  </g>

  <g fill="none" stroke="#0f172a" stroke-width="3" stroke-linecap="round" opacity="0.78" marker-end="url(#arrow)">
    <path d="M236 557 H260"/>
    <path d="M386 557 H410"/>
    <path d="M536 557 H560"/>
    <path d="M686 557 H710"/>
    <path d="M836 557 H860"/>
    <path d="M986 557 H1010"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif">
    <g>
      <rect x="110" y="528" width="126" height="58" rx="18" fill="#0f172a" opacity="0.92"/>
      <circle cx="136" cy="557" r="14" fill="#38bdf8"/>
      <text x="136" y="562" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="900">1</text>
      <text x="177" y="552" text-anchor="middle" fill="#e0f2fe" font-size="13" font-weight="800">Goal</text>
      <text x="177" y="570" text-anchor="middle" fill="#bae6fd" font-size="11">success criteria</text>
    </g>
    <g>
      <rect x="260" y="528" width="126" height="58" rx="18" fill="#0f172a" opacity="0.92"/>
      <circle cx="286" cy="557" r="14" fill="#38bdf8"/>
      <text x="286" y="562" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="900">2</text>
      <text x="327" y="552" text-anchor="middle" fill="#e0f2fe" font-size="13" font-weight="800">Trigger</text>
      <text x="327" y="570" text-anchor="middle" fill="#bae6fd" font-size="11">schedule / event</text>
    </g>
    <g>
      <rect x="410" y="528" width="126" height="58" rx="18" fill="#0f172a" opacity="0.92"/>
      <circle cx="436" cy="557" r="14" fill="#38bdf8"/>
      <text x="436" y="562" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="900">3</text>
      <text x="477" y="552" text-anchor="middle" fill="#e0f2fe" font-size="13" font-weight="800">Intake</text>
      <text x="477" y="570" text-anchor="middle" fill="#bae6fd" font-size="11">find work</text>
    </g>
    <g>
      <rect x="560" y="528" width="126" height="58" rx="18" fill="#0f172a" opacity="0.92"/>
      <circle cx="586" cy="557" r="14" fill="#38bdf8"/>
      <text x="586" y="562" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="900">4</text>
      <text x="627" y="552" text-anchor="middle" fill="#e0f2fe" font-size="13" font-weight="800">Agent work</text>
      <text x="627" y="570" text-anchor="middle" fill="#bae6fd" font-size="11">isolated tools</text>
    </g>
    <g>
      <rect x="710" y="528" width="126" height="58" rx="18" fill="#0f172a" opacity="0.92"/>
      <circle cx="736" cy="557" r="14" fill="#38bdf8"/>
      <text x="736" y="562" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="900">5</text>
      <text x="777" y="552" text-anchor="middle" fill="#e0f2fe" font-size="13" font-weight="800">Verify</text>
      <text x="777" y="570" text-anchor="middle" fill="#bae6fd" font-size="11">tests / evals</text>
    </g>
    <g>
      <rect x="860" y="528" width="126" height="58" rx="18" fill="#0f172a" opacity="0.92"/>
      <circle cx="886" cy="557" r="14" fill="#38bdf8"/>
      <text x="886" y="562" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="900">6</text>
      <text x="927" y="552" text-anchor="middle" fill="#e0f2fe" font-size="13" font-weight="800">Persist</text>
      <text x="927" y="570" text-anchor="middle" fill="#bae6fd" font-size="11">state / receipts</text>
    </g>
    <g>
      <rect x="1010" y="528" width="126" height="58" rx="18" fill="#0f172a" opacity="0.92"/>
      <circle cx="1036" cy="557" r="14" fill="#38bdf8"/>
      <text x="1036" y="562" text-anchor="middle" fill="#0f172a" font-size="13" font-weight="900">7</text>
      <text x="1077" y="552" text-anchor="middle" fill="#e0f2fe" font-size="13" font-weight="800">Repeat</text>
      <text x="1077" y="570" text-anchor="middle" fill="#bae6fd" font-size="11">or escalate</text>
    </g>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="15">
    <circle cx="95" cy="675" r="5" fill="#38bdf8"/>
    <text x="112" y="680" fill="#cbd5e1">Core contract: objective, trigger, intake, workspace, context, delegation, verification, state, budget, escalation, exit.</text>
  </g>
</svg>
