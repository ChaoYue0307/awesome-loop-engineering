<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Loop Engineering contract cards</title>
  <desc id="desc">A spacious visual grid of the Loop Engineering contract: objective, trigger, intake, workspace, context, delegation, verification, state, budget, escalation, and exit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="90" y1="120" x2="1120" y2="650" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1e293b" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0f172a" stop-opacity="0.96"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#020617" flood-opacity="0.32"/>
    </filter>
    <style>
      .title { fill: #f8fafc; font: 900 38px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; letter-spacing: -0.03em; }
      .subtitle { fill: #bae6fd; font: 600 17px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
      .label { fill: #e0f2fe; font: 800 19px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
      .small { fill: #cbd5e1; font: 500 13px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
      .number { fill: #020617; font: 900 14px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <circle cx="110" cy="78" r="260" fill="#0ea5e9" opacity="0.15"/>
  <circle cx="1070" cy="130" r="280" fill="#8b5cf6" opacity="0.18"/>
  <circle cx="980" cy="720" r="300" fill="#22c55e" opacity="0.08"/>
  <path d="M72 112 C292 30 454 32 600 98 C748 164 910 164 1128 92" stroke="url(#accent)" stroke-width="2" opacity="0.34"/>

  <text x="72" y="74" class="title">Loop Contract</text>
  <text x="72" y="106" class="subtitle">A reviewable operating spec for recurring AI-agent systems.</text>

  <g transform="translate(72 146)" filter="url(#shadow)">
    <rect width="252" height="112" rx="22" fill="url(#card)" stroke="#334155"/>
    <circle cx="32" cy="31" r="16" fill="#38bdf8"/><text x="28" y="36" class="number">1</text>
    <text x="24" y="72" class="label">Objective</text>
    <text x="24" y="96" class="small">Define the outcome to optimize.</text>
  </g>
  <g transform="translate(348 146)" filter="url(#shadow)">
    <rect width="252" height="112" rx="22" fill="url(#card)" stroke="#334155"/>
    <circle cx="32" cy="31" r="16" fill="#38bdf8"/><text x="28" y="36" class="number">2</text>
    <text x="24" y="72" class="label">Trigger</text>
    <text x="24" y="96" class="small">Choose schedule, event, or goal.</text>
  </g>
  <g transform="translate(624 146)" filter="url(#shadow)">
    <rect width="252" height="112" rx="22" fill="url(#card)" stroke="#334155"/>
    <circle cx="32" cy="31" r="16" fill="#38bdf8"/><text x="28" y="36" class="number">3</text>
    <text x="24" y="72" class="label">Discover / Intake</text>
    <text x="24" y="96" class="small">Find work from queues or signals.</text>
  </g>
  <g transform="translate(900 146)" filter="url(#shadow)">
    <rect width="252" height="112" rx="22" fill="url(#card)" stroke="#334155"/>
    <circle cx="32" cy="31" r="16" fill="#38bdf8"/><text x="28" y="36" class="number">4</text>
    <text x="24" y="72" class="label">Workspace</text>
    <text x="24" y="96" class="small">Act in an isolated environment.</text>
  </g>

  <g transform="translate(72 292)" filter="url(#shadow)">
    <rect width="252" height="112" rx="22" fill="url(#card)" stroke="#334155"/>
    <circle cx="32" cy="31" r="16" fill="#a78bfa"/><text x="28" y="36" class="number">5</text>
    <text x="24" y="72" class="label">Context</text>
    <text x="24" y="96" class="small">Load durable knowledge and state.</text>
  </g>
  <g transform="translate(348 292)" filter="url(#shadow)">
    <rect width="252" height="112" rx="22" fill="url(#card)" stroke="#334155"/>
    <circle cx="32" cy="31" r="16" fill="#a78bfa"/><text x="28" y="36" class="number">6</text>
    <text x="24" y="72" class="label">Delegation</text>
    <text x="24" y="96" class="small">Route work to agent roles.</text>
  </g>
  <g transform="translate(624 292)" filter="url(#shadow)">
    <rect width="252" height="112" rx="22" fill="url(#card)" stroke="#334155"/>
    <circle cx="32" cy="31" r="16" fill="#a78bfa"/><text x="28" y="36" class="number">7</text>
    <text x="24" y="72" class="label">Verification</text>
    <text x="24" y="96" class="small">Gate with tests, evals, traces.</text>
  </g>
  <g transform="translate(900 292)" filter="url(#shadow)">
    <rect width="252" height="112" rx="22" fill="url(#card)" stroke="#334155"/>
    <circle cx="32" cy="31" r="16" fill="#a78bfa"/><text x="28" y="36" class="number">8</text>
    <text x="24" y="72" class="label">State</text>
    <text x="24" y="96" class="small">Persist progress and receipts.</text>
  </g>

  <g transform="translate(72 438)" filter="url(#shadow)">
    <rect width="252" height="112" rx="22" fill="url(#card)" stroke="#334155"/>
    <circle cx="32" cy="31" r="16" fill="#22c55e"/><text x="28" y="36" class="number">9</text>
    <text x="24" y="72" class="label">Budget</text>
    <text x="24" y="96" class="small">Cap retries, time, and cost.</text>
  </g>
  <g transform="translate(348 438)" filter="url(#shadow)">
    <rect width="252" height="112" rx="22" fill="url(#card)" stroke="#334155"/>
    <circle cx="32" cy="31" r="16" fill="#22c55e"/><text x="24" y="36" class="number">10</text>
    <text x="24" y="72" class="label">Escalation</text>
    <text x="24" y="96" class="small">Hand off when judgment is needed.</text>
  </g>
  <g transform="translate(624 438)" filter="url(#shadow)">
    <rect width="252" height="112" rx="22" fill="url(#card)" stroke="#334155"/>
    <circle cx="32" cy="31" r="16" fill="#22c55e"/><text x="24" y="36" class="number">11</text>
    <text x="24" y="72" class="label">Exit</text>
    <text x="24" y="96" class="small">Know when the loop is done.</text>
  </g>
  <g transform="translate(900 438)" filter="url(#shadow)">
    <rect width="252" height="112" rx="22" fill="#020617" fill-opacity="0.72" stroke="#38bdf8" stroke-opacity="0.5"/>
    <path d="M38 52 C58 30 94 30 114 52" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <path d="M106 38 L116 53 L98 52" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M114 70 C94 92 58 92 38 70" stroke="#a78bfa" stroke-width="5" stroke-linecap="round"/>
    <path d="M46 84 L36 69 L54 70" fill="none" stroke="#a78bfa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="132" y="57" class="label">Next Action</text>
    <text x="132" y="82" class="small">Repeat, report, PR, or stop.</text>
  </g>

  <rect x="72" y="614" width="1080" height="78" rx="24" fill="#020617" fill-opacity="0.62" stroke="#334155"/>
  <text x="104" y="646" class="subtitle">Prompt, context, and harness improve one run.</text>
  <text x="104" y="673" class="subtitle">Loop Engineering governs repeated agent work over time.</text>
</svg>
