<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Awesome Loop Engineering social preview</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 640px; margin: 0; overflow: hidden; }
      body {
        background: #f7f9fc;
        color: #121722;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .preview {
        position: relative;
        display: grid;
        grid-template-columns: 1.3fr 0.7fr;
        width: 100%;
        height: 100%;
        padding: 68px 76px 58px;
        border-top: 12px solid #155eef;
      }
      .preview::after {
        content: "";
        position: absolute;
        left: 76px;
        right: 76px;
        bottom: 142px;
        border-top: 1px solid #9eabc0;
      }
      .identity { min-width: 0; }
      .kicker {
        margin: 0 0 26px;
        color: #155eef;
        font: 700 18px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
        text-transform: uppercase;
      }
      h1 { max-width: 720px; margin: 0; font-size: 74px; line-height: 0.98; font-weight: 800; }
      .tagline { margin: 26px 0 0; color: #155eef; font-size: 31px; line-height: 1.2; font-weight: 700; }
      .support { max-width: 720px; margin: 18px 0 0; color: #5c6678; font-size: 20px; line-height: 1.45; }
      .mark {
        display: flex;
        align-items: center;
        justify-content: center;
        padding-bottom: 64px;
      }
      .mark img { display: block; width: 306px; height: 306px; }
      .stats {
        position: absolute;
        left: 76px;
        right: 76px;
        bottom: 48px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
      }
      .stat { padding-top: 20px; }
      .stat + .stat { border-left: 1px solid #cfd7e5; padding-left: 32px; }
      .stat b { display: block; font-size: 27px; line-height: 1.1; }
      .stat span { display: block; margin-top: 5px; color: #7c8799; font-size: 14px; font-weight: 700; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <main class="preview">
      <div class="identity">
        <p class="kicker">The field guide for recurring AI-agent systems</p>
        <h1>Awesome Loop Engineering</h1>
        <p class="tagline">Design loops, not just prompts.</p>
        <p class="support">Discover. Delegate. Verify. Persist. Decide.</p>
      </div>
      <div class="mark">
        <img src="../assets/awesome-loop-engineering-logo.svg" alt="">
      </div>
      <div class="stats">
        <div class="stat"><b>509</b><span>Curated entries</span></div>
        <div class="stat"><b>15</b><span>Operational patterns</span></div>
        <div class="stat"><b>15</b><span>Validated contracts</span></div>
      </div>
    </main>
  </body>
</html>
