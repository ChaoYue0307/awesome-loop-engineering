<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Awesome Loop Engineering social preview</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 640px; margin: 0; overflow: hidden; }
      body {
        background: #f7f9fc;
        color: #121722;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .preview {
        position: relative;
        display: grid;
        grid-template-columns: 1.34fr 0.66fr;
        width: 100%;
        height: 100%;
        padding: 58px 72px 52px;
        border-top: 10px solid #155eef;
      }
      .preview::after {
        content: "";
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 136px;
        border-top: 1px solid #b8c3d4;
      }
      .identity { min-width: 0; }
      .kicker {
        margin: 0 0 21px;
        color: #155eef;
        font: 700 17px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
        text-transform: uppercase;
      }
      h1 { max-width: 760px; margin: 0; font-size: 70px; line-height: 0.98; font-weight: 800; letter-spacing: 0; }
      .tagline { margin: 22px 0 0; color: #155eef; font-size: 30px; line-height: 1.2; font-weight: 750; }
      .support { max-width: 720px; margin: 15px 0 0; color: #5c6678; font-size: 19px; line-height: 1.45; }
      .mark {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        margin-bottom: 70px;
        border-left: 1px solid #cfd7e5;
        padding-left: 44px;
      }
      .mark img { display: block; width: 286px; height: 286px; }
      .mark p { margin: 0; color: #7055d9; font: 700 13px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; text-transform: uppercase; }
      .stats {
        position: absolute;
        left: 72px;
        right: 72px;
        bottom: 39px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
      }
      .stat { padding-top: 17px; }
      .stat + .stat { border-left: 1px solid #cfd7e5; padding-left: 26px; }
      .stat b { display: block; color: #121722; font-size: 31px; line-height: 1.05; }
      .stat:first-child b { color: #155eef; }
      .stat span { display: block; margin-top: 6px; color: #687487; font-size: 12px; font-weight: 700; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <main class="preview">
      <div class="identity">
        <p class="kicker">Source-audited field guide + implementation kit</p>
        <h1>Awesome Loop Engineering</h1>
        <p class="tagline">Design loops, not just prompts.</p>
        <p class="support">From model recurrence to verified agent work and bounded operations.</p>
      </div>
      <div class="mark">
        <img src="../assets/awesome-loop-engineering-logo.png" alt="">
        <p>Model / agent / operations</p>
      </div>
      <div class="stats">
        <div class="stat"><b>579</b><span>Source-audited resources</span></div>
        <div class="stat"><b>20</b><span>Operational patterns</span></div>
        <div class="stat"><b>20</b><span>Validated contracts</span></div>
        <div class="stat"><b>8</b><span>Runtime starters</span></div>
      </div>
    </main>
  </body>
</html>
