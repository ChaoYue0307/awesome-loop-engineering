<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Loop Engineering contract cards</title>
  <desc id="desc">The eleven parts of a Loop Contract grouped into three phases: set up (objective, trigger, discover/intake, workspace), run (context, delegation, verification, state), and govern and close (budget, escalation, exit), leading to the next action.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1120"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="accent" x1="74" y1="94" x2="1126" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#172033"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#020617" flood-opacity="0.32"/>
    </filter>
    <style>
      .title { fill: #f8fafc; font: 900 40px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; letter-spacing: -0.035em; }
      .subtitle { fill: #c2cad8; font: 600 18px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
      .eyebrow { fill: #7dd3fc; font: 800 13px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; letter-spacing: 0.16em; }
      .phase { font: 800 13px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; letter-spacing: 0.14em; }
      .phasesub { fill: #8b95a7; font: 500 13px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
      .label { fill: #f8fafc; font: 800 20px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
      .small { fill: #c2cad8; font: 500 14px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
      .number { fill: #04121f; font: 900 15px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <rect x="34" y="34" width="1132" height="692" rx="28" fill="#020617" fill-opacity="0.20" stroke="#1e293b"/>
  <text x="74" y="70" class="eyebrow">LOOP ENGINEERING</text>
  <text x="74" y="104" class="title">Loop Contract</text>
  <text x="520" y="99" class="subtitle">A reviewable operating spec for recurring AI-agent systems.</text>
  <path d="M74 122 H1126" stroke="url(#accent)" stroke-width="2" opacity="0.7"/>

  <!-- phase labels -->
  <g>
    <circle cx="80" cy="146" r="5.5" fill="#38bdf8"/>
    <text x="96" y="151" class="phase" fill="#7dd3fc">SET UP</text>
    <text x="176" y="151" class="phasesub">define the work and the boundary</text>

    <circle cx="80" cy="286" r="5.5" fill="#a78bfa"/>
    <text x="96" y="291" class="phase" fill="#c4b5fd">RUN</text>
    <text x="146" y="291" class="phasesub">give the agent context, roles, gates, and memory</text>

    <circle cx="80" cy="426" r="5.5" fill="#34d399"/>
    <text x="96" y="431" class="phase" fill="#6ee7b7">GOVERN &amp; CLOSE</text>
    <text x="256" y="431" class="phasesub">bound the run, hand off, and know when it is done</text>
  </g>

  <!-- Row 1: SET UP (cyan) -->
  <g class="row" filter="url(#shadow)">
    <g transform="translate(74 162)">
      <rect width="252" height="112" rx="20" fill="url(#card)" stroke="#2a4763"/>
      <circle cx="34" cy="32" r="16" fill="#38bdf8"/><text x="34" y="37" text-anchor="middle" class="number">1</text>
      <text x="26" y="72" class="label">Objective</text><text x="26" y="97" class="small">Define the outcome to optimize.</text>
    </g>
    <g transform="translate(350 162)">
      <rect width="252" height="112" rx="20" fill="url(#card)" stroke="#2a4763"/>
      <circle cx="34" cy="32" r="16" fill="#38bdf8"/><text x="34" y="37" text-anchor="middle" class="number">2</text>
      <text x="26" y="72" class="label">Trigger</text><text x="26" y="97" class="small">Choose schedule, event, or goal.</text>
    </g>
    <g transform="translate(626 162)">
      <rect width="252" height="112" rx="20" fill="url(#card)" stroke="#2a4763"/>
      <circle cx="34" cy="32" r="16" fill="#38bdf8"/><text x="34" y="37" text-anchor="middle" class="number">3</text>
      <text x="26" y="72" class="label">Discover / Intake</text><text x="26" y="97" class="small">Find work from queues or signals.</text>
    </g>
    <g transform="translate(902 162)">
      <rect width="252" height="112" rx="20" fill="url(#card)" stroke="#2a4763"/>
      <circle cx="34" cy="32" r="16" fill="#38bdf8"/><text x="34" y="37" text-anchor="middle" class="number">4</text>
      <text x="26" y="72" class="label">Workspace</text><text x="26" y="97" class="small">Act in an isolated environment.</text>
    </g>
  </g>

  <!-- Row 2: RUN (violet) -->
  <g class="row" filter="url(#shadow)">
    <g transform="translate(74 302)">
      <rect width="252" height="112" rx="20" fill="url(#card)" stroke="#3a3268"/>
      <circle cx="34" cy="32" r="16" fill="#a78bfa"/><text x="34" y="37" text-anchor="middle" class="number">5</text>
      <text x="26" y="72" class="label">Context</text><text x="26" y="97" class="small">Load durable knowledge and state.</text>
    </g>
    <g transform="translate(350 302)">
      <rect width="252" height="112" rx="20" fill="url(#card)" stroke="#3a3268"/>
      <circle cx="34" cy="32" r="16" fill="#a78bfa"/><text x="34" y="37" text-anchor="middle" class="number">6</text>
      <text x="26" y="72" class="label">Delegation</text><text x="26" y="97" class="small">Route work to agent roles.</text>
    </g>
    <g transform="translate(626 302)">
      <rect width="252" height="112" rx="20" fill="url(#card)" stroke="#3a3268"/>
      <circle cx="34" cy="32" r="16" fill="#a78bfa"/><text x="34" y="37" text-anchor="middle" class="number">7</text>
      <text x="26" y="72" class="label">Verification</text><text x="26" y="97" class="small">Gate with tests, evals, traces.</text>
    </g>
    <g transform="translate(902 302)">
      <rect width="252" height="112" rx="20" fill="url(#card)" stroke="#3a3268"/>
      <circle cx="34" cy="32" r="16" fill="#a78bfa"/><text x="34" y="37" text-anchor="middle" class="number">8</text>
      <text x="26" y="72" class="label">State</text><text x="26" y="97" class="small">Persist progress and receipts.</text>
    </g>
  </g>

  <!-- Row 3: GOVERN & CLOSE (green) + Next Action -->
  <g class="row" filter="url(#shadow)">
    <g transform="translate(74 442)">
      <rect width="252" height="112" rx="20" fill="url(#card)" stroke="#1f4a37"/>
      <circle cx="34" cy="32" r="16" fill="#34d399"/><text x="34" y="37" text-anchor="middle" class="number">9</text>
      <text x="26" y="72" class="label">Budget</text><text x="26" y="97" class="small">Cap retries, time, and cost.</text>
    </g>
    <g transform="translate(350 442)">
      <rect width="252" height="112" rx="20" fill="url(#card)" stroke="#1f4a37"/>
      <circle cx="34" cy="32" r="16" fill="#34d399"/><text x="34" y="37" text-anchor="middle" class="number">10</text>
      <text x="26" y="72" class="label">Escalation</text><text x="26" y="97" class="small">Hand off when judgment is needed.</text>
    </g>
    <g transform="translate(626 442)">
      <rect width="252" height="112" rx="20" fill="url(#card)" stroke="#1f4a37"/>
      <circle cx="34" cy="32" r="16" fill="#34d399"/><text x="34" y="37" text-anchor="middle" class="number">11</text>
      <text x="26" y="72" class="label">Exit</text><text x="26" y="97" class="small">Know when the loop is done.</text>
    </g>
    <g transform="translate(902 442)">
      <rect width="252" height="112" rx="20" fill="#081726" stroke="#38bdf8" stroke-opacity="0.7"/>
      <path d="M35 55 C55 33 92 33 112 55" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
      <path d="M104 41 L115 56 L96 55" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M112 73 C92 95 55 95 35 73" stroke="#a78bfa" stroke-width="5" stroke-linecap="round"/>
      <path d="M43 87 L32 72 L51 73" fill="none" stroke="#a78bfa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="140" y="58" class="label">Next</text>
      <text x="140" y="84" class="label">Action</text>
    </g>
  </g>

  <rect x="74" y="590" width="1052" height="102" rx="20" fill="#081726" stroke="#334155"/>
  <text x="106" y="632" class="subtitle" fill="#e2e8f0">Prompt, context, and harness improve <tspan font-style="italic">one run</tspan>.</text>
  <text x="106" y="664" class="subtitle" fill="#e2e8f0">Loop Engineering governs repeated agent work <tspan font-style="italic">over time</tspan>: repeat, report, open a PR, escalate, or stop.</text>
</svg>
