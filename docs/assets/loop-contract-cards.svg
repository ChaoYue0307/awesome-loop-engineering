<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Loop Engineering contract cards</title>
  <desc id="desc">A clean visual grid of the Loop Engineering contract: objective, trigger, intake, workspace, context, delegation, verification, state, budget, escalation, and exit.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="760" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08111f"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="74" y1="94" x2="1126" y2="690" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38bdf8"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#172033"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
    <style>
      .title { fill: #f8fafc; font: 900 42px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; letter-spacing: -0.035em; }
      .subtitle { fill: #cbd5e1; font: 600 18px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
      .eyebrow { fill: #7dd3fc; font: 800 13px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; letter-spacing: 0.14em; }
      .label { fill: #f8fafc; font: 800 20px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
      .small { fill: #cbd5e1; font: 500 14px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
      .number { fill: #020617; font: 900 14px Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif; }
    </style>
  </defs>

  <rect width="1200" height="760" rx="34" fill="url(#bg)"/>
  <rect x="34" y="34" width="1132" height="692" rx="28" fill="#020617" fill-opacity="0.22" stroke="#1e293b"/>
  <path d="M74 118 H1126" stroke="url(#accent)" stroke-width="2" opacity="0.6"/>
  <path d="M76 598 H1124" stroke="#334155" stroke-width="1"/>

  <text x="74" y="70" class="eyebrow">LOOP ENGINEERING</text>
  <text x="74" y="106" class="title">Loop Contract</text>
  <text x="520" y="101" class="subtitle">A reviewable operating spec for recurring AI-agent systems.</text>

  <g transform="translate(74 152)" filter="url(#shadow)">
    <rect width="252" height="116" rx="22" fill="url(#card)" stroke="#334155"/>
    <circle cx="32" cy="31" r="16" fill="#38bdf8"/><text x="28" y="36" class="number">1</text>
    <text x="24" y="72" class="label">Objective</text>
    <text x="24" y="98" class="small">Define the outcome to optimize.</text>
  </g>
  <g transform="translate(350 152)" filter="url(#shadow)">
    <rect width="252" height="116" rx="22" fill="url(#card)" stroke="#334155"/>
    <circle cx="32" cy="31" r="16" fill="#38bdf8"/><text x="28" y="36" class="number">2</text>
    <text x="24" y="72" class="label">Trigger</text>
    <text x="24" y="98" class="small">Choose schedule, event, or goal.</text>
  </g>
  <g transform="translate(626 152)" filter="url(#shadow)">
    <rect width="252" height="116" rx="22" fill="url(#card)" stroke="#334155"/>
    <circle cx="32" cy="31" r="16" fill="#38bdf8"/><text x="28" y="36" class="number">3</text>
    <text x="24" y="72" class="label">Discover / Intake</text>
    <text x="24" y="98" class="small">Find work from queues or signals.</text>
  </g>
  <g transform="translate(902 152)" filter="url(#shadow)">
    <rect width="252" height="116" rx="22" fill="url(#card)" stroke="#334155"/>
    <circle cx="32" cy="31" r="16" fill="#38bdf8"/><text x="28" y="36" class="number">4</text>
    <text x="24" y="72" class="label">Workspace</text>
    <text x="24" y="98" class="small">Act in an isolated environment.</text>
  </g>

  <g transform="translate(74 292)" filter="url(#shadow)">
    <rect width="252" height="116" rx="22" fill="url(#card)" stroke="#334155"/>
    <circle cx="32" cy="31" r="16" fill="#a78bfa"/><text x="28" y="36" class="number">5</text>
    <text x="24" y="72" class="label">Context</text>
    <text x="24" y="98" class="small">Load durable knowledge and state.</text>
  </g>
  <g transform="translate(350 292)" filter="url(#shadow)">
    <rect width="252" height="116" rx="22" fill="url(#card)" stroke="#334155"/>
    <circle cx="32" cy="31" r="16" fill="#a78bfa"/><text x="28" y="36" class="number">6</text>
    <text x="24" y="72" class="label">Delegation</text>
    <text x="24" y="98" class="small">Route work to agent roles.</text>
  </g>
  <g transform="translate(626 292)" filter="url(#shadow)">
    <rect width="252" height="116" rx="22" fill="url(#card)" stroke="#334155"/>
    <circle cx="32" cy="31" r="16" fill="#a78bfa"/><text x="28" y="36" class="number">7</text>
    <text x="24" y="72" class="label">Verification</text>
    <text x="24" y="98" class="small">Gate with tests, evals, traces.</text>
  </g>
  <g transform="translate(902 292)" filter="url(#shadow)">
    <rect width="252" height="116" rx="22" fill="url(#card)" stroke="#334155"/>
    <circle cx="32" cy="31" r="16" fill="#a78bfa"/><text x="28" y="36" class="number">8</text>
    <text x="24" y="72" class="label">State</text>
    <text x="24" y="98" class="small">Persist progress and receipts.</text>
  </g>

  <g transform="translate(74 432)" filter="url(#shadow)">
    <rect width="252" height="116" rx="22" fill="url(#card)" stroke="#334155"/>
    <circle cx="32" cy="31" r="16" fill="#22c55e"/><text x="28" y="36" class="number">9</text>
    <text x="24" y="72" class="label">Budget</text>
    <text x="24" y="98" class="small">Cap retries, time, and cost.</text>
  </g>
  <g transform="translate(350 432)" filter="url(#shadow)">
    <rect width="252" height="116" rx="22" fill="url(#card)" stroke="#334155"/>
    <circle cx="32" cy="31" r="16" fill="#22c55e"/><text x="24" y="36" class="number">10</text>
    <text x="24" y="72" class="label">Escalation</text>
    <text x="24" y="98" class="small">Hand off when judgment is needed.</text>
  </g>
  <g transform="translate(626 432)" filter="url(#shadow)">
    <rect width="252" height="116" rx="22" fill="url(#card)" stroke="#334155"/>
    <circle cx="32" cy="31" r="16" fill="#22c55e"/><text x="24" y="36" class="number">11</text>
    <text x="24" y="72" class="label">Exit</text>
    <text x="24" y="98" class="small">Know when the loop is done.</text>
  </g>

  <g transform="translate(902 432)" filter="url(#shadow)">
    <rect width="252" height="116" rx="22" fill="#07111f" stroke="#38bdf8" stroke-opacity="0.62"/>
    <path d="M35 53 C55 31 92 31 112 53" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
    <path d="M104 39 L115 54 L96 53" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M112 73 C92 95 55 95 35 73" stroke="#a78bfa" stroke-width="5" stroke-linecap="round"/>
    <path d="M43 87 L32 72 L51 73" fill="none" stroke="#a78bfa" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="136" y="56" class="label">Next</text>
    <text x="136" y="82" class="label">Action</text>
  </g>

  <rect x="74" y="620" width="1080" height="72" rx="22" fill="#07111f" stroke="#334155"/>
  <text x="106" y="650" class="subtitle">Prompt, context, and harness improve one run.</text>
  <text x="106" y="676" class="subtitle">Loop Engineering governs repeated agent work over time: repeat, report, open a PR, escalate, or stop.</text>
</svg>
